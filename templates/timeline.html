<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{ timelines[selected].title }} · Operations Timeline</title>
<style>
:root{font-family:Arial,Helvetica,sans-serif;color:#172333;background:#eef1f5}*{box-sizing:border-box}
body{margin:0}header{background:white;border-bottom:1px solid #d9dee6;padding:12px 20px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
h1{font-size:21px;margin:0}header .right{margin-left:auto;display:flex;align-items:center;gap:12px}select,button{font:inherit;padding:7px 10px;border:1px solid #c7d1df;border-radius:7px;background:white;cursor:pointer}
main{padding:14px 16px}.legend{display:flex;gap:18px;font-size:12px;align-items:center;margin:0 0 12px}.dot{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px}.muted{color:#5a6878}.status{margin-left:auto}
.panel{background:white;border:1px solid #d6dee7;border-radius:9px;overflow:hidden}.ruler,.lane{display:grid;grid-template-columns:175px minmax(0,1fr)}.ruler{border-bottom:2px solid #c9d1dc;position:sticky;top:0;background:white;z-index:12}.ruler-label,.lane-label{padding:12px;border-right:1px solid #dce2ea;font-size:12px;font-weight:bold}.ruler-track{height:47px;position:relative;overflow:hidden}.lane{min-height:70px;border-bottom:1px solid #ebeff4}.lane-label{display:flex;flex-direction:column;justify-content:center;gap:4px;overflow-wrap:anywhere}.lane-label span{font-weight:normal;color:#64748b;font-size:11px}.lane.unallocated{background:#fff6f5}.track{min-height:70px;position:relative;overflow:hidden}.guide{position:absolute;top:0;bottom:0;border-left:1px solid #edf0f3;pointer-events:none}.nowline{position:absolute;top:0;bottom:0;left:12.73%;border-left:3px solid #dc2626;pointer-events:none;z-index:10}.nowtext{position:absolute;left:12.73%;top:2px;transform:translateX(-50%);color:#b91c1c;font-weight:bold;font-size:10px;background:white;padding:1px 3px;z-index:11}.tick{position:absolute;top:25px;transform:translateX(-50%);font-size:11px;color:#475569;white-space:nowrap}.job{position:absolute;top:9px;min-width:122px;max-width:195px;padding:7px 8px;border-radius:7px;background:#2563eb;color:#fff;font-size:11px;line-height:1.4;box-shadow:0 1px 4px #0003;cursor:pointer;border:1px solid #1d4ed8;text-align:left}.job strong{display:block;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.job span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.job.overdue{background:#b91c1c;border-color:#991b1b}.job:focus-visible{outline:3px solid #111827}
/* Compact one-line pickup markers; full information remains in the modal. */
.job{width:148px;min-width:0;max-width:148px;height:27px;padding:4px 7px;line-height:17px;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.job .compact-text{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700}
.lane,.track{min-height:48px}.stale .lane-label{color:#b91c1c}.overdue-panel{margin-top:12px;padding:12px}.overdue-list{display:flex;flex-wrap:wrap;gap:9px}.overdue-list button{border:1px solid #991b1b;background:#b91c1c;color:#fff;font-size:12px}.empty{padding:20px;color:#64748b}
dialog{width:min(850px,94vw);max-height:88vh;border:0;border-radius:10px;padding:0;box-shadow:0 10px 50px #0005}dialog::backdrop{background:#17233380}.modal-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px;border-bottom:1px solid #d8e0e8}.modal-body{padding:15px;overflow:auto;max-height:74vh}.detail-grid{display:grid;grid-template-columns:145px 1fr;gap:7px 12px;font-size:13px}.detail-grid dt{font-weight:bold;color:#526071}.detail-grid dd{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}.section{margin-top:18px;border-top:1px solid #dce2e9;padding-top:10px}.section h3{font-size:14px;margin:4px 0 8px}.section p{font-size:12px;white-space:pre-wrap}.stops{border-collapse:collapse;width:100%;font-size:12px}.stops td,.stops th{padding:7px;border-bottom:1px solid #e7eaf0;text-align:left}.media-list{display:flex;gap:12px;flex-wrap:wrap}.media-list a{font-size:12px;overflow-wrap:anywhere}.error{color:#b91c1c}
@media(max-width:700px){.ruler,.lane{grid-template-columns:110px minmax(0,1fr)}.ruler-label,.lane-label{padding:7px}main{padding:8px}.job{width:116px;min-width:0;max-width:116px}}

/* Delivery-deadline board states; same compact card geometry. */
.job.deadline{background:#d97706;color:#fff;border-color:#b45309}
.job.nearing{background:#f9a8d4;color:#831843;border-color:#db2777}
.job.overdue{background:#b91c1c;color:#fff;border-color:#991b1b}
.callback-actions{display:flex;flex-wrap:wrap;align-items:center;gap:9px;margin-top:12px}.callback-actions label{font-size:12px;color:#526071;width:100%;font-weight:bold}.callback-actions input{width:125px;padding:7px;border:1px solid #c7d1df;border-radius:6px}.callback-actions button{font-size:12px}
</style></head>
<body>
<header><h1 id="heading">{{ timelines[selected].title }}</h1><div class="right"><label for="selector">Timeline</label><select id="selector">{% for code,board in timelines.items() %}<option value="{{ code }}"{% if code==selected %} selected{% endif %}>{{ board.title }}</option>{% endfor %}</select><span id="clock" class="muted"></span><span id="health" class="muted">Loading…</span></div></header>
<main><div class="legend"><span id="legend-upcoming"><i class="dot" style="background:#2563eb"></i>Upcoming</span><span id="legend-warning" hidden><i class="dot" style="background:#f9a8d4"></i>Within 15 minutes</span><span><i class="dot" style="background:#b91c1c"></i>Overdue</span><span id="legend-removal">Arrived / collected / cancelled → removed on next update</span><span class="status">Next 4 hours · refresh 30 seconds</span></div>
<section class="panel"><div class="ruler"><div class="ruler-label">Allocation</div><div class="ruler-track" id="ruler"></div></div><div id="lanes"><div class="empty">Loading jobs…</div></div></section>
<section class="panel overdue-panel" id="older" hidden><strong id="older-title">Older overdue pickups</strong><p class="muted" style="font-size:12px">Outstanding items remain visible after leaving the timeline.</p><div class="overdue-list" id="older-list"></div></section></main>
<dialog id="details"><div class="modal-head"><strong id="modal-title">Job details</strong><button id="close-dialog" type="button" aria-label="Close">×</button></div><div class="modal-body" id="modal-content">Loading…</div></dialog>
<script>
const BOARD={{ selected|tojson }};
const configs={{ timelines|tojson }};
const config=configs[BOARD];
const deliveryBoard=BOARD==='delivery';
const callbackBoard=BOARD==='callback';
if(deliveryBoard){
 document.getElementById('legend-upcoming').innerHTML='<i class="dot" style="background:#d97706"></i>Deadline upcoming';
 document.getElementById('legend-warning').hidden=false;
 document.getElementById('legend-removal').textContent='Delivered / cancelled → removed on next update';
 document.getElementById('older-title').textContent='Older overdue deliveries';
}
if(callbackBoard){
 document.getElementById('legend-upcoming').innerHTML='<i class="dot" style="background:#d97706"></i>Callback upcoming';
 document.getElementById('legend-warning').hidden=false;
 document.getElementById('legend-removal').textContent='Courier arrived / cancelled / suppressed → removed';
 document.getElementById('older-title').textContent='Older overdue callbacks';
}
const total=config.past_minutes+config.future_minutes;
const nowPct=100*config.past_minutes/total;
const region=document.getElementById('lanes'), ruler=document.getElementById('ruler');
const modal=document.getElementById('details'), modalContent=document.getElementById('modal-content');
let jobs=[],lastLoaded=null,loadBusy=false,detailSequence=0;
const timeFormat=new Intl.DateTimeFormat('en-GB',{timeZone:'Europe/London',hour:'2-digit',minute:'2-digit'});
function el(tag,text,cls){const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined&&text!==null)n.textContent=String(text);return n}
function fmt(value){if(value===null||value===undefined||value==='')return '—';if(typeof value==='string'&&/^\d{4}-\d{2}-\d{2}T/.test(value)){const d=new Date(value);return Number.isNaN(d.getTime())?value:new Intl.DateTimeFormat('en-GB',{dateStyle:'short',timeStyle:'short',timeZone:'Europe/London'}).format(d)}return String(value)}
function minsUntil(when,now){return (Date.parse(when)-now)/60000}
function pos(when,now){return 100*(config.past_minutes+minsUntil(when,now))/total}
function render(){
 const now=Date.now();document.getElementById('clock').textContent=timeFormat.format(now);
 const ticks=[-config.past_minutes,0,30,60,120,180,240];
 ruler.replaceChildren();for(const n of ticks){if(n>config.future_minutes)continue;const x=100*(config.past_minutes+n)/total;const t=el('div',n===0?'NOW':timeFormat.format(now+n*60000),'tick');t.style.left=x+'%';ruler.append(t)}
 const nr=el('div',undefined,'nowline');nr.style.left=nowPct+'%';ruler.append(nr);
 const groups=new Map();groups.set('UNALLOCATED',{label:'Unallocated',sub:'Awaiting driver or agent',items:[]});const old=[];
 for(const j of jobs){const delta=minsUntil(j.critical_at,now);if(delta< -config.past_minutes){old.push(j);continue}if(delta>config.future_minutes)continue;
 const code=j.allocation_code||'UNALLOCATED';const key=j.allocation_type==='UNALLOCATED'?'UNALLOCATED':j.allocation_type+':'+code;
 if(!groups.has(key))groups.set(key,{label:code,sub:j.allocation_name||j.allocation_type,items:[]});groups.get(key).items.push(j)}
 region.replaceChildren();
 for(const [key,g] of groups){const lane=el('div',undefined,'lane'+(key==='UNALLOCATED'?' unallocated':''));const label=el('div',undefined,'lane-label');label.append(el('strong',g.label),el('span',g.sub));const track=el('div',undefined,'track');
 for(let x=30;x<config.future_minutes;x+=30){const guide=el('div',undefined,'guide');guide.style.left=100*(config.past_minutes+x)/total+'%';track.append(guide)}
 const nowLine=el('div',undefined,'nowline');nowLine.style.left=nowPct+'%';track.append(nowLine);
 // Colliding pickup markers stack vertically instead of covering one another.
 // Compact markers use their actual rendered width for overlap detection.
 // This prevents jobs at the same time from covering one another without
 // wasting vertical space across a busy unallocated lane.
 const positions=[];
 const trackWidth=Math.max(1,ruler.getBoundingClientRect().width);
 const markerWidth=window.innerWidth<=700?116:148;
 const markerPct=100*(markerWidth+5)/trackWidth;
 const ordered=[...g.items].sort((a,b)=>Date.parse(a.critical_at)-Date.parse(b.critical_at));
 for(const j of ordered){
   const x=Math.max(0,Math.min(100-100*markerWidth/trackWidth,pos(j.critical_at,now)));
   let level=0;
   while(positions.some(p=>p.level===level && x<p.x+markerPct && p.x<x+markerPct))level++;
   positions.push({x,level});
   const until=minsUntil(j.critical_at,now);
   const colourClass=(deliveryBoard||callbackBoard)?(until<=0?' overdue':until<=15?' nearing':' deadline'):(until<=0?' overdue':'');
   const b=el('button',undefined,'job'+colourClass);
   b.type='button';b.style.left=x+'%';b.style.top=(7+level*32)+'px';
   const account=(j.account_name||'Job').trim().split(/\s+/)[0];
   const postcode=deliveryBoard?(j.delivery_postcode||j.pickup_postcode):j.pickup_postcode;
   const caption=[account,j.vehicle_code||'',postcode||'',callbackBoard?'CB'+(Number(j.callback_count||0)+1):''].filter(Boolean).join(' · ');
   b.append(el('span',caption,'compact-text'));
   b.title=[j.account_name||'Job',j.job_ref,j.vehicle_code||'',postcode||'',callbackBoard?'Callback '+(Number(j.callback_count||0)+1):'',timeFormat.format(new Date(j.critical_at))].filter(Boolean).join(' · ');
   b.setAttribute('aria-label',b.title);
   b.addEventListener('click',()=>openJob(j.job_ref));track.append(b);
 }
 track.style.minHeight=Math.max(48,14+Math.max(1,...positions.map(p=>p.level+1))*32)+'px';lane.append(label,track);region.append(lane)}
 const older=document.getElementById('older'), ol=document.getElementById('older-list');older.hidden=old.length===0;ol.replaceChildren();old.sort((a,b)=>Date.parse(a.critical_at)-Date.parse(b.critical_at));for(const j of old){const b=el('button',`${j.job_ref} · ${j.account_name||''} · ${fmt(j.critical_at)} · ${j.allocation_code||'Unallocated'}`);b.onclick=()=>openJob(j.job_ref);ol.append(b)}
 }
async function load(){if(loadBusy)return;loadBusy=true;try{const res=await fetch('/api/timeline/'+encodeURIComponent(BOARD),{cache:'no-store',credentials:'same-origin'});if(res.status===401){location.href='/auth/login';return}const p=await res.json();if(!res.ok||!p.ok)throw new Error(p.error||'Unable to load timeline');jobs=p.jobs;lastLoaded=Date.now();document.getElementById('health').textContent=jobs.length+' outstanding · updated '+timeFormat.format(lastLoaded);render()}catch(e){document.getElementById('health').textContent='Refresh failed';document.getElementById('health').className='error';console.error(e)}finally{loadBusy=false}}
function addField(dl,label,value){dl.append(el('dt',label),el('dd',fmt(value)))}
async function openJob(ref){const sequence=++detailSequence;document.getElementById('modal-title').textContent='Job '+ref;modalContent.replaceChildren(el('p','Loading details…'));modal.showModal();try{const r=await fetch('/api/job-board/'+encodeURIComponent(ref),{credentials:'same-origin',cache:'no-store'});const d=await r.json();if(!r.ok||!d.ok)throw Error(d.error||'Detail unavailable');if(sequence!==detailSequence||!modal.open)return;renderDetail(d)}catch(e){if(sequence===detailSequence)modalContent.replaceChildren(el('p',e.message,'error'))}}
function section(title){const s=el('section',undefined,'section');s.append(el('h3',title));modalContent.append(s);return s}
function renderDetail(d){modalContent.replaceChildren();const j=d.job;const dl=el('dl',undefined,'detail-grid');for(const [k,v] of [['Account',j.account_name],['Account Ref',j.account_ref],['Driver', [j.driver_callsign,j.driver_firstname,j.driver_lastname].filter(Boolean).join(' ')],['External agent',[j.agent_code,j.agent_name].filter(Boolean).join(' ')],['Vehicle',[j.vehicle_code,j.vehicle_description].filter(Boolean).join(' · ')],['Booked time',j.booked_at],['Freedom status',j.freedom_status],['Goods',j.goods],['Special instructions',j.special_instructions],['Despatch instructions',j.despatch_instructions]])addField(dl,k,v);modalContent.append(dl);
 if(callbackBoard)renderCallback(d);
 const s=section('Stops');const table=el('table',undefined,'stops');const h=el('tr');for(const c of ['Stop','Location','Required','Deadline','Arrived','Completed'])h.append(el('th',c));table.append(h);for(const st of d.stops){const tr=el('tr');for(const value of [st.drop_order,[st.address_name,st.address_line_1,st.postcode].filter(Boolean).join(', '),fmt(st.required_from),fmt(st.deadline_at),fmt(st.arrived_at),fmt(st.date_completed)])tr.append(el('td',value));table.append(tr)}s.append(table);
 const n=section('Notes ('+d.notes.length+')');if(!d.notes.length)n.append(el('p','No notes'));for(const note of d.notes)n.append(el('p',[note.source,note.sender,fmt(note.received_at||note.created_at),note.note_text||note.subject].filter(Boolean).join(' · ')));
 const m=section('Media ('+d.media.length+')');if(!d.media.length)m.append(el('p','No media'));const links=el('div',undefined,'media-list');for(const media of d.media){const a=el('a',media.original_filename||media.caption||'Open media');a.href=media.url;a.target='_blank';a.rel='noopener noreferrer';links.append(a)}m.append(links)}

function renderCallback(d){
 const c=d.callbacks||{}, st=d.callback_state||{};
 const s=section('Callback Management');
 const dl=el('dl',undefined,'detail-grid');
 addField(dl,'Callbacks completed',c.callback_count===undefined?(d.callback_events||[]).length:c.callback_count);
 addField(dl,'Last callback at',c.last_callback_at||(d.callback_events||[])[0]?.message_time);
 addField(dl,'Next due',c.next_due_at);
 addField(dl,'Priority',c.is_priority===undefined?'—':c.is_priority?'Priority':'Standard');
 addField(dl,'Status',st.is_suppressed?'Suppressed':c.next_due_at?'Active':'Not currently eligible');
 s.append(dl);
 const edit=el('div',undefined,'callback-actions');
 const l=el('label','First callback due (minutes after booking, ASAP only)');
 const input=el('input');input.type='number';input.min='1';input.max='1440';input.placeholder=c.is_priority?'20':'45';input.value=st.first_override_minutes??'';
 const save=el('button','Save override');save.type='button';
 const reset=el('button','Clear override');reset.type='button';
 async function update(payload){
   save.disabled=true;reset.disabled=true;remove.disabled=true;
   try {const r=await fetch('/api/callback/'+encodeURIComponent(d.job.job_ref)+'/settings',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
   const j=await r.json();if(!r.ok||!j.ok)throw Error(j.error||'Unable to save');modal.close();await load();}
   catch(e){alert(e.message)}finally{save.disabled=false;reset.disabled=false;remove.disabled=false}
 }
 save.onclick=()=>{const n=Number(input.value);if(!Number.isInteger(n)||n<1||n>1440){alert('Enter 1–1440 minutes');return}
  update({first_override_minutes:n,is_suppressed:!!st.is_suppressed,suppression_reason:st.suppression_reason||undefined});};
 reset.onclick=()=>update({first_override_minutes:null,is_suppressed:!!st.is_suppressed,suppression_reason:st.suppression_reason||undefined});
 edit.append(l,input,save,reset);
 const reasonLabel=el('label','Callback suppression reason');
 const reason=el('select');
 for(const [value,label] of [['Collection at leisure','Collection at leisure'],['Client requests no callbacks','Client requests no callbacks'],['Other operational reason','Other operational reason']]){const opt=el('option',label);opt.value=value;reason.append(opt)}
 if(st.suppression_reason)reason.value=st.suppression_reason;
 const remove=el('button',st.is_suppressed?'Restore callbacks':'Remove from Callback Board');remove.type='button';
 remove.onclick=()=>update({first_override_minutes:input.value===''?null:Number(input.value),is_suppressed:!st.is_suppressed,suppression_reason:!st.is_suppressed?reason.value:null});
 edit.append(reasonLabel,reason,remove);s.append(edit);
 const history=d.callback_events||[];
 if(history.length){const p=el('p',history.map(e=>fmt(e.message_time)+' · '+e.action_label).join('\n'));s.append(p)}
}

document.getElementById('close-dialog').onclick=()=>modal.close();modal.addEventListener('close',()=>detailSequence++);
document.getElementById('selector').onchange=e=>{location.href=e.target.value==='prebooked'?'/':'/board/'+encodeURIComponent(e.target.value)};
load();setInterval(load,30000);setInterval(render,15000);
</script></body></html>
